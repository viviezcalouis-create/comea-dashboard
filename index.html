<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEA Election Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fbfbfa; color: #37352f; padding: 40px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
        .nav { display: flex; gap: 20px; border-bottom: 1px solid #e9e9e8; padding-bottom: 10px; margin-bottom: 20px; }
        .card { background: white; border: 1px solid #e9e9e8; border-radius: 8px; padding: 25px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 11px; color: #acaba9; text-transform: uppercase; padding: 10px; border-bottom: 1px solid #e9e9e8; letter-spacing: 0.5px; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f1f0; font-size: 14px; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #fb6a6a; color: white; text-transform: uppercase; }
        button { cursor: pointer; background: #fff; border: 1px solid #e9e9e8; padding: 5px 10px; border-radius: 4px; font-size: 12px; transition: 0.2s; }
        button:hover { background: #f1f1f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗳️ COMEA Dashboard</h1>
            <div id="connection-status" style="font-size: 12px; color: #acaba9;">Connecting...</div>
        </div>
        
        <div class="nav">
            <strong style="border-bottom: 2px solid #37352f; padding-bottom: 10px;">Voter Validation</strong>
            <span style="color: #acaba9">Audit Log</span>
            <span style="color: #acaba9">Registry</span>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">Pending Issues (Quarantine)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Email Used</th>
                        <th>Error Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="quarantine-list">
                    <tr><td colspan="3" style="text-align:center; color:#acaba9; padding: 40px;">No issues detected yet. System is clear.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // Your Verified Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAamL4eLt5pcFU980aNHXzqTbH6v-Ae6-s",
            authDomain: "lg-comea-masterapp.firebaseapp.com",
            databaseURL: "https://lg-comea-masterapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lg-comea-masterapp",
            storageBucket: "lg-comea-masterapp.firebasestorage.app",
            messagingSenderId: "109521703047",
            appId: "1:109521703047:web:73be0ad05d55ecb87ea822"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();
            document.getElementById('connection-status').innerText = "● System Online";
            document.getElementById('connection-status').style.color = "#27ae60";

            // Real-time listener for "Pesky" voters
            database.ref('quarantine').on('value', (snapshot) => {
                const list = document.getElementById('quarantine-list');
                const data = snapshot.val();
                
                if (data) {
                    list.innerHTML = '';
                    Object.keys(data).forEach(key => {
                        const entry = data[key];
                        const row = `<tr>
                            <td>${entry.email || 'Unknown'}</td>
                            <td><span class="status-badge">${entry.error || 'Check Log'}</span></td>
                            <td><button onclick="clearVote('${key}')">Mark Resolved</button></td>
                        </tr>`;
                        list.innerHTML += row;
                    });
                } else {
                    list.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#acaba9; padding: 40px;">No issues detected yet. System is clear.</td></tr>';
                }
            }, (error) => {
                console.error("Firebase Error:", error);
                document.getElementById('connection-status').innerText = "● Connection Error";
                document.getElementById('connection-status').style.color = "#eb5757";
            });

        } catch (e) {
            console.error("Initialization Error:", e);
            alert("Configuration Error: Check console for details.");
        }

        // Resolution function
        function clearVote(id) {
            if(confirm("Confirm: Have you manually verified or deleted this response in Google Forms?")) {
                firebase.database().ref('quarantine/' + id).remove()
                .then(() => {
                    console.log("Record cleared.");
                })
                .catch((error) => {
                    alert("Error clearing record: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
