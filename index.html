<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COMEA Election Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fbfbfa; color: #37352f; padding: 50px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
        .nav { display: flex; gap: 20px; border-bottom: 1px solid #e9e9e8; padding-bottom: 10px; margin-bottom: 20px; }
        .card { background: white; border: 1px solid #e9e9e8; border-radius: 8px; padding: 25px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 12px; color: #acaba9; text-transform: uppercase; padding: 10px; border-bottom: 1px solid #e9e9e8; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f1f0; font-size: 14px; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: #fb6a6a; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗳️ COMEA Dashboard</h1>
        </div>
        
        <div class="nav">
            <strong>Voter Validation</strong>
            <span style="color: #acaba9">Audit Log</span>
            <span style="color: #acaba9">Registry</span>
        </div>

        <div class="card">
            <h3>Pending Issues</h3>
            <table>
                <thead>
                    <tr>
                        <th>Email Used</th>
                        <th>Error Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="quarantine-list">
                    <tr><td colspan="3" style="text-align:center; color:#acaba9;">No issues detected yet. System is clear.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAamL4eLt5pcFU980aNHXzqTbH6v-Ae6-s",
            authDomain: "lg-comea-masterapp.firebaseapp.com",
            databaseURL: "https://lg-comea-masterapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lg-comea-masterapp",
            storageBucket: "lg-comea-masterapp.firebasestorage.app",
            messagingSenderId: "109521703047",
            appId: "1:109521703047:web:73be0ad05d55ecb87ea822"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Real-time listener for "Pesky" voters
        database.ref('quarantine').on('value', (snapshot) => {
            const list = document.getElementById('quarantine-list');
            const data = snapshot.val();
            if (data) {
                list.innerHTML = '';
                Object.keys(data).forEach(key => {
                    const row = `<tr>
                        <td>${data[key].email}</td>
                        <td><span class="status-badge">${data[key].error}</span></td>
                        <td><button onclick="clearVote('${key}')">Resolved</button></td>
                    </tr>`;
                    list.innerHTML += row;
                });
            }
        });

        function clearVote(id) {
            if(confirm("Confirm: You have manually deleted this from the Google Form?")) {
                database.ref('quarantine/' + id).remove();
            }
        }
    </script>
</body>
</html>
